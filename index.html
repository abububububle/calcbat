<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calculadora de Bateria 2.0</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ee;--card:#fff;--tx:#16201c;--mut:#5f6e67;--line:#d6ddd8;--ac:#0b6b4f;--acx:#fff;--cell:#0b6b4f;
--ok:#14602f;--okb:#d9f2e1;--wn:#8a5a00;--wnb:#fdecc4;--bd:#9b1c1c;--bdb:#fbdcdc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#e5eee9;--mut:#9aaaa2;--line:#2b3830;--ac:#5fd3a5;--acx:#08241a;--cell:#5fd3a5;--ok:#7ee2a3;--okb:#15301f;--wn:#f3c25b;--wnb:#33280d;--bd:#f59a9a;--bdb:#3a1919}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--tx:#e5eee9;--mut:#9aaaa2;--line:#2b3830;--ac:#5fd3a5;--acx:#08241a;--cell:#5fd3a5;--ok:#7ee2a3;--okb:#15301f;--wn:#f3c25b;--wnb:#33280d;--bd:#f59a9a;--bdb:#3a1919}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
nav{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
nav button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:.88rem;padding:9px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 10px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.82rem;color:var(--mut)}
label.w{grid-column:1/-1}
input,select{width:100%;margin-top:3px;font:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx)}
.r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.r:last-child{border:0}.r span{color:var(--mut)}.r b{text-align:right}
.big{font-size:2rem;font-weight:800;letter-spacing:-.02em;color:var(--ac);margin:0 0 4px}
.viz{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:6px}
.bar{width:100%;max-width:260px;text-align:center;font-weight:800;border-radius:6px;padding:1px 0;font-size:.85rem}
.pos{background:var(--bd);color:#fff}.neg{background:var(--mut);color:var(--card)}
.g{display:grid;gap:3px;width:100%;max-width:260px}
.g i{height:12px;border-radius:4px;background:var(--cell);opacity:.9}
.note{font-size:.84rem;color:var(--mut);margin:8px 0 0}
.warn{background:var(--wnb);color:var(--wn);border-radius:9px;padding:8px 10px;font-size:.88rem;margin-top:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.item b{display:block}.item small{color:var(--mut)}
.tag{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:700}
.t-ok{background:var(--okb);color:var(--ok)}.t-wn{background:var(--wnb);color:var(--wn)}.t-bd{background:var(--bdb);color:var(--bd)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:1rem;color:var(--tx);font-weight:600}
.sw input{width:22px;height:22px;margin:0;accent-color:var(--ac)}
svg{width:100%;height:auto;display:block}
.ax{stroke:var(--line)}.ln{fill:none;stroke:var(--ac);stroke-width:2}.tx{fill:var(--mut);font-size:10px}
</style>
</head>
<body>
<main>
<h1>Calculadora de Bateria</h1>
<p class="sub">Monte o pack manualmente ou deixe o motor definir o tamanho da bateria.</p>
<div class="card"><label class="sw">Calcular pelo motor<input id="mot" type="checkbox"></label></div>
<div class="card"><h2>Parâmetros</h2><div class="f">
<label class="w">Célula<select id="cel"></select></label>
<label class="m0">Séries (xS)<input id="xs" type="number" inputmode="numeric" min="1" value="10"></label>
<label class="m0">Paralelos (yP)<input id="yp" type="number" inputmode="numeric" min="1" value="3"></label>
<label class="m1">Potência (W)<input id="w" type="number" inputmode="decimal" min="0"></label>
<label class="m1">Tensão (V)<input id="v" type="number" inputmode="decimal" min="0" value="72"></label>
<label class="m1">Corrente (A)<input id="i" type="number" inputmode="decimal" min="0" value="40"></label>
<label class="m1">Autonomia (km)<input id="au" type="number" inputmode="decimal" min="0" value="100"></label>
<label class="m1 w">Consumo (Wh/km)<input id="co" type="number" inputmode="decimal" min="0"></label>
</div><p class="note m1">Informe dois entre potência, tensão e corrente: o terceiro é calculado. Consumo e autonomia também se completam.</p></div>
<div id="o"></div>
</main>
<script>
const E=(n,mah,a,p)=>({n,vn:3.7,vmin:3,vmax:4.2,mah,a,p,pad:18650});
const CEL=[E("Samsung-25R",2500,20,55),E("Samsung-30Q",3000,15,55),E("Samsung-35E",3500,10,45),E("LG-MJ1",3500,10,70),E("LG-HG2",3000,20,50),E("Panasonic-GA",3500,15,70),E("Sony-VTC6",3000,30,53),E("Molicel-P26A",2600,35,40),E("Molicel-P28A",2800,35,40)];
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)&&v>0?v:null};
const f=(n,d=1)=>n.toLocaleString("pt-BR",{maximumFractionDigits:d});
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const up=x=>Math.ceil(x-1e-9);
const rows=l=>l.map(([k,v])=>`<div class="r"><span>${k}</span><b>${v}</b></div>`).join("");
const IDS=["mot","cel","xs","yp","w","v","i","au","co"];
$("cel").innerHTML=CEL.map(c=>`<option>${c.n}</option>`).join("");$("cel").value="Samsung-30Q";
try{const s=JSON.parse(localStorage.getItem("bat2")||"{}");IDS.forEach(k=>{if(k in s){k==="mot"?$(k).checked=s[k]:$(k).value=s[k]}})}catch(e){}
function viz(s,p){
  if(s*p>520)return `<p class="note">Pack grande demais para desenhar (${s*p} células).</p>`;
  return `<div class="viz"><div class="bar pos">+</div><div class="g" style="grid-template-columns:repeat(${p},1fr)">${"<i></i>".repeat(s*p)}</div><div class="bar neg">−</div></div><p class="note">${s} linhas em série, ${p} células em paralelo por linha.</p>`;
}
function chart(En,mark){
  const W=320,H=170,L=38,B=22,T=8,R=8,pw=W-L-R,ph=H-B-T,max=Math.max(1,Math.floor(En));
  const X=c=>L+(c-1)/99*pw,Y=a=>T+ph-(a/max)*ph;
  let d="";for(let c=1;c<=100;c++)d+=(c>1?"L":"M")+X(c).toFixed(1)+" "+Y(Math.floor(En/c)).toFixed(1);
  let m="";if(mark&&mark.c>=1&&mark.c<=100)m=`<circle cx="${X(mark.c)}" cy="${Y(mark.a)}" r="4" fill="var(--bd)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Autonomia por consumo"><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}"/><line class="ax" x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/><path class="ln" d="${d}"/>${m}<text class="tx" x="${L-4}" y="${T+8}" text-anchor="end">${f(max,0)}</text><text class="tx" x="${L-4}" y="${T+ph}" text-anchor="end">0</text><text class="tx" x="${L}" y="${H-6}">1</text><text class="tx" x="${W-R}" y="${H-6}" text-anchor="end">100 Wh/km</text></svg><p class="note">Autonomia (km) em função do consumo (Wh/km).</p>`;
}
function calc(){
  const mot=$("mot").checked,c=CEL.find(x=>x.n===$("cel").value),o=$("o");
  document.querySelectorAll(".m0").forEach(e=>e.style.display=mot?"none":"");
  document.querySelectorAll(".m1").forEach(e=>e.style.display=mot?"":"none");
  let xs,yp,mHtml="",warn="",W=num("w"),V=num("v"),I=num("i"),A=num("au"),C=num("co");
  if(mot){
    if(V&&I)W=V*I;else if(W&&I)V=up(W/I);else if(W&&V)I=up(W/V);
    if(!V||!I){o.innerHTML=`<div class="card"><p class="note">Informe pelo menos dois entre potência, tensão e corrente.</p></div>`;return}
    xs=up(V/c.vn);yp=up(I/(c.mah/1000));
  }else{
    xs=Math.round(num("xs")||0);yp=Math.round(num("yp")||0);
    if(!xs||!yp){o.innerHTML=`<div class="card"><p class="note">Informe séries e paralelos maiores que zero.</p></div>`;return}
  }
  const n=xs*yp,vn=c.vn*xs,mah=c.mah*yp,a=c.a*yp,en=vn*mah/1000,cost=c.p*n;
  if(mot){
    const L=[["Potência",f(W,0)+" W"],["Tensão",f(V,0)+" V"],["Corrente",f(I,0)+" A"]];
    if(W)L.push(["Tempo de uso (Corrente max)",f(Math.round(en/W*10)/10)+" h"]);
    let au=A,co=C;
    if(C)au=Math.floor(en/C);else if(A)co=Math.floor(en/A);
    if(au)L.push(["Autonomia estimada",f(au,0)+" km"]);
    if(co)L.push(["Consumo estimado",f(co,0)+" Wh/km"]);
    mHtml=`<div class="card"><h2>Dados do motor</h2>${rows(L)}</div>`;
    if(a<I)warn=`<div class="warn">Atenção: a bateria entrega no máximo ${f(a,0)} A, abaixo dos ${f(I,0)} A do motor.</div>`;
    window._m=C?{c:C,a:au}:(A&&co?{c:co,a:A}:null);
  }else window._m=null;
  o.innerHTML=mHtml+`<div class="card"><p class="big">${xs}S${yp}P</p>${rows([["Total de células",n+" células"],["Tensão nominal",f(vn)+" V"],["Tensão mínima / máxima",f(c.vmin*xs)+" / "+f(c.vmax*xs)+" V"],["Capacidade",f(mah,0)+" mAh"],["Corrente máx. de descarga",f(a,0)+" A"],["Energia total",f(en,0)+" Wh"],["Custo estimado",brl(cost)]])}${warn}</div>
  <div class="card"><h2>Visualização do pack</h2>${viz(xs,yp)}</div>
  <div class="card"><h2>Autonomia por consumo</h2>${chart(en,window._m)}</div>
  <div class="card"><h2>Célula ${c.n}</h2>${rows([["Padrão",c.pad],["Tensão nominal / mín. / máx.",`${c.vn} / ${c.vmin} / ${c.vmax} V`],["Capacidade",f(c.mah,0)+" mAh"],["Corrente máx. de descarga",c.a+" A"],["Custo individual",brl(c.p)]])}</div>`;
  try{const s={};IDS.forEach(k=>s[k]=k==="mot"?$(k).checked:$(k).value);localStorage.setItem("bat2",JSON.stringify(s))}catch(e){}
}
IDS.forEach(k=>$(k).addEventListener("input",calc));
calc();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
